name: CI for OCaml Interpreter

on:
  push:
    branches: [ il-interpreter ]
    paths:
      - spectec/**
      - .github/workflows/ci-ocaml-interpreter.yaml

  workflow_dispatch:

jobs:
  spec-tec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.1.x
      - name: Setup Dune
        run: opam install --yes dune menhir mdx zarith && eval $(opam env)
      - name: Build and Test wasm-3.0 core up except 'return_<>.wast' files
        run: |
          cd spectec
          opam exec make build_ocamlprog 'SPEC=../specification/testing2/*' 'TEST=test-interpreter/spec-test-3/'
      - name: Test slow return_<>.wast files
        run: |
          cd spectec
          opam exec make run_ocaml 'SPEC=../specification/testing2/*' 'TEST=test-interpreter/spec-test-3/slow-return/'