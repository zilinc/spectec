
name: CI for DL meta-interpreter on Wasm-3.0

on:
  push:
    branches: [ il-animate** ]
    paths: [ spectec/**, specification/wasm-3.0/** ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  spectec-animation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        inline:
          - "--inline"
          - ""

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.4.x
      - name: Setup Dune
        run: opam install --yes dune menhir mdx zarith tsort
      - name: Build
        run: |
          cd spectec && opam exec make
      - name: Test wasm-3.0
        run: |
          cd spectec
          opam exec make anim-test-all 'SPECTEC_FLAGS=--animate ${{ matrix.inline }} --new-interpreter-v'


